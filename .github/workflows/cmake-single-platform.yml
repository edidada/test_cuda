# CUDA 构建工作流（重写于 2026-11-01）
#
# 背景：原 starter workflow 用 ubuntu-latest + apt 装 nvidia-cuda-toolkit，
# 5 次 run 全部在 job 启动初期失败（日志已过期无法取证）。修复策略：
#
# 1. 宿主 runner 固定 ubuntu-24.04（2026 起 ubuntu-latest 已指向 26.04，
#    不吃 ubuntu-latest 漂移的亏）。
# 2. 真正的构建跑在 nvidia/cuda:12.6.3-devel-ubuntu24.04 容器里——
#    CUDA 版本与镜像自带主机编译器全部对齐官方，不依赖 Ubuntu 源的
#    nvidia-cuda-toolkit（README.md 明确弃用该路线，见 README 方案2）。
#    镜像 tag 存在性核对过 nvidia/container-images/cuda supported-tags。
# 3. 无 GPU 的 GitHub runner 上只做编译验证；本程序运行需要真实 GPU，
#    源码没有 CUDA 错误检查（见 src/test_cuda.cu），故不设运行 step。
# 4. 仓库未定义 ctest 测试，删除原模板里的 Test 步骤（空 ctest 会报
#    "No tests were found"）。
name: CMake CUDA build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install cmake
      run: |
        apt-get update
        apt-get install -y --no-install-recommends cmake

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build build -j$(nproc) --config ${{env.BUILD_TYPE}}

    - name: Verify binary
      run: ls -lh build/test_cuda
